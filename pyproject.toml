[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farmlens"
version = "0.1.0"
description = "An explainable NSW crop suitability demo"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "streamlit>=1.50,<2",
  "folium>=0.18,<1",
  "streamlit-folium>=0.23,<1",
  "openai>=1.66,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/tuannm3812/FarmLens"
Issues = "https://github.com/tuannm3812/FarmLens/issues"

[tool.setuptools.packages.find]
include = ["farmlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
